<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design a Color Grid</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #111;
    color: #eee;
  }
  h2 { font-weight: 600; margin-bottom: 0.25rem; }
  p.hint { margin-top: 0; color: #888; font-size: 0.85rem; }

  #palette {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 1rem 0;
  }
  .swatch {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .swatch.selected { border-color: #e8e4d8; }
  .swatch.erase {
    background: #1c1c1c;
    background-image:
      linear-gradient(45deg, #444 25%, transparent 25%, transparent 75%, #444 75%),
      linear-gradient(45deg, #444 25%, transparent 25%, transparent 75%, #444 75%);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(22, 1fr);
    gap: 2px;
    background: #000;
    padding: 2px;
    border-radius: 6px;
    touch-action: none;
    user-select: none;
  }
  .cell {
    aspect-ratio: 1 / 1;
    background: #161616;
    border-radius: 1px;
  }

  label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #bbb;
  }
  button {
    padding: 0.9rem;
    font-size: 1.1rem;
    margin-top: 1rem;
    border-radius: 8px;
    border: none;
    background: #e8e4d8;
    color: #111;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  button.secondary {
    background: transparent;
    border: 1px solid #444;
    color: #eee;
  }
  .row { display: flex; gap: 0.75rem; }
  .row button { flex: 1; }
  #status { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
  .divider {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #333;
    font-size: 0.85rem;
  }
  .divider a { color: #bbb; }
</style>
</head>
<body>
  <h2>Design a Color Grid</h2>
  <p class="hint">Pick a color, then click or drag across the board to paint it. 22×6, same as the physical display.</p>

  <div id="palette"></div>

  <div id="grid"></div>

  <label><input type="checkbox" id="pinned" /> Pin — show now, stay until unpinned</label>
  <div class="row">
    <button id="clearBtn" type="button" class="secondary">Clear</button>
    <button id="sendBtn" type="button">Send to board</button>
  </div>
  <div id="status"></div>

  <div class="divider">
    <a href="/compose">← Back to text posting</a>
  </div>

  <script>
    const ROWS = 6, COLS = 22;
    const BLANK_CODE = 0;

    // Must match spec/charset.json's chip entries (codes 56-62) exactly —
    // there's no charset endpoint to fetch this from, so it's a build-time
    // constant here the same way service/compose/normalize.py hardcodes it.
    const CHIPS = [
      { code: 56, hex: "#C0392B", name: "Red" },
      { code: 57, hex: "#E67E22", name: "Orange" },
      { code: 58, hex: "#F1C40F", name: "Yellow" },
      { code: 59, hex: "#27AE60", name: "Green" },
      { code: 60, hex: "#2980B9", name: "Blue" },
      { code: 61, hex: "#8E44AD", name: "Violet" },
      { code: 62, hex: "#ECF0F1", name: "White" },
    ];

    const grid = new Array(ROWS * COLS).fill(BLANK_CODE);
    let selectedCode = CHIPS[0].code;
    let painting = false;

    const paletteEl = document.getElementById("palette");
    const gridEl = document.getElementById("grid");

    function renderPalette() {
      paletteEl.innerHTML = "";
      for (const chip of CHIPS) {
        const btn = document.createElement("button");
        btn.className = "swatch" + (chip.code === selectedCode ? " selected" : "");
        btn.style.background = chip.hex;
        btn.title = chip.name;
        btn.addEventListener("click", () => { selectedCode = chip.code; renderPalette(); });
        paletteEl.appendChild(btn);
      }
      const erase = document.createElement("button");
      erase.className = "swatch erase" + (selectedCode === BLANK_CODE ? " selected" : "");
      erase.title = "Erase";
      erase.addEventListener("click", () => { selectedCode = BLANK_CODE; renderPalette(); });
      paletteEl.appendChild(erase);
    }

    function hexFor(code) {
      if (code === BLANK_CODE) return "#161616";
      const chip = CHIPS.find((c) => c.code === code);
      return chip ? chip.hex : "#161616";
    }

    function paintCell(index) {
      grid[index] = selectedCode;
      gridEl.children[index].style.background = hexFor(selectedCode);
    }

    function cellIndexFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el || !el.classList.contains("cell")) return null;
      return Number(el.dataset.index);
    }

    function renderGrid() {
      gridEl.innerHTML = "";
      for (let i = 0; i < ROWS * COLS; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = String(i);
        cell.style.background = hexFor(grid[i]);
        gridEl.appendChild(cell);
      }
    }

    gridEl.addEventListener("pointerdown", (e) => {
      painting = true;
      const index = cellIndexFromPoint(e.clientX, e.clientY);
      if (index !== null) paintCell(index);
    });
    window.addEventListener("pointermove", (e) => {
      if (!painting) return;
      const index = cellIndexFromPoint(e.clientX, e.clientY);
      if (index !== null) paintCell(index);
    });
    window.addEventListener("pointerup", () => { painting = false; });

    document.getElementById("clearBtn").addEventListener("click", () => {
      grid.fill(BLANK_CODE);
      renderGrid();
    });

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const button = document.getElementById("sendBtn");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Sending…";
      try {
        const res = await fetch("/message/grid", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            grid,
            pinned: document.getElementById("pinned").checked,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        status.textContent = "Sent.";
      } catch (err) {
        status.textContent = "Failed: " + err.message;
      } finally {
        button.disabled = false;
      }
    });

    renderPalette();
    renderGrid();
  </script>
</body>
</html>
