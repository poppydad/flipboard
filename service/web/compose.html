<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Post to Board</title>
<!-- "Add to Home Screen" on iOS: opens without Safari's chrome, so posting a
     message is one tap from the home screen rather than a bookmark hunt. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Board" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111111" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" href="/icon.png" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 480px;
    margin: 2rem auto;
    /* viewport-fit=cover means the page runs under the notch/home indicator
       when launched from the home screen; keep content clear of both. */
    padding: env(safe-area-inset-top) calc(1rem + env(safe-area-inset-right))
             env(safe-area-inset-bottom) calc(1rem + env(safe-area-inset-left));
    background: #111;
    color: #eee;
  }
  h2 { font-weight: 600; }
  textarea {
    width: 100%;
    font-size: 1.1rem;
    padding: 0.75rem;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;
    resize: vertical;
  }
  label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #bbb;
  }
  button {
    width: 100%;
    padding: 0.9rem;
    font-size: 1.1rem;
    margin-top: 1rem;
    border-radius: 8px;
    border: none;
    background: #e8e4d8;
    color: #111;
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; }
  button.secondary {
    background: transparent;
    border: 1px solid #444;
    color: #eee;
  }
  .slider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.9rem;
  }
  .slider label {
    margin: 0;
    flex: 0 0 5.5rem;
    font-size: 0.85rem;
  }
  .slider input[type=range] { flex: 1; min-width: 0; accent-color: #e8e4d8; }
  .slider span {
    flex: 0 0 3rem;
    text-align: right;
    font-size: 0.85rem;
    color: #bbb;
    font-variant-numeric: tabular-nums;
  }
  #status, #unpinStatus, #quietStatus, #queueStatus, #displayStatus {
    margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em;
  }
  #queue { list-style: none; margin: 0; padding: 0; }
  #queue li {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid #262626;
    font-size: 0.95rem;
  }
  #queue li:last-child { border-bottom: none; }
  #queue .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #queue .tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: #8a8a8a;
    margin-left: 0.4rem;
    white-space: nowrap;
  }
  #queue li.showing .label { color: #e8e4d8; }
  #queue li:not(.showing) .label { color: #9a9a9a; }
  /* Destructive and small: never the thing your thumb finds by accident. */
  #queue .del {
    width: auto;
    margin: 0;
    padding: 0.35rem 0.7rem;
    font-size: 0.85rem;
    font-weight: 400;
    background: transparent;
    border: 1px solid #3a3a3a;
    color: #c88;
    border-radius: 6px;
    flex: none;
  }
  .divider {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #333;
  }
  .divider p {
    margin: 0 0 0.5rem;
    font-size: 0.85rem;
    color: #888;
  }
</style>
</head>
<body>
  <h2>Post to Board</h2>
  <form id="composeForm">
    <textarea name="text" rows="3" maxlength="132" placeholder="What should the board say?" required></textarea>
    <label><input type="checkbox" name="pinned" /> Pin — show now, stay until unpinned</label>
    <button type="submit">Send</button>
  </form>
  <div id="status"></div>

  <div class="divider">
    <p>Pinned something and want it to rotate normally again?</p>
    <button id="unpinButton" type="button" class="secondary">Unpin current message</button>
    <div id="unpinStatus"></div>
  </div>

  <div class="divider">
    <p>On the board right now, and what's queued behind it:</p>
    <ul id="queue"></ul>
    <div id="queueStatus"></div>
  </div>

  <div class="divider">
    <p>Display</p>
    <div class="slider">
      <label for="brightness">Brightness</label>
      <input type="range" id="brightness" min="10" max="100" step="5" />
      <span id="brightnessOut">100%</span>
    </div>
    <div class="slider">
      <label for="contrast">Contrast</label>
      <input type="range" id="contrast" min="50" max="150" step="5" />
      <span id="contrastOut">100%</span>
    </div>
    <div id="displayStatus"></div>
  </div>

  <div class="divider">
    <p id="quietState">Quiet hours…</p>
    <button id="quietButton" type="button" class="secondary" hidden></button>
    <div id="quietStatus"></div>
  </div>

  <div class="divider">
    <p><a href="/compose/grid" style="color: #bbb;">Design a color grid →</a></p>
  </div>

  <script>
    document.getElementById("composeForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const button = form.querySelector("button");
      const status = document.getElementById("status");

      button.disabled = true;
      status.textContent = "Sending…";
      try {
        const res = await fetch("/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: form.text.value,
            pinned: form.pinned.checked,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        status.textContent = "Sent.";
        form.reset();
        loadQueue();
      } catch (err) {
        status.textContent = "Failed: " + err.message;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("unpinButton").addEventListener("click", async () => {
      const button = document.getElementById("unpinButton");
      const status = document.getElementById("unpinStatus");

      button.disabled = true;
      status.textContent = "Checking what's on the board…";
      try {
        const current = await fetch("/current").then((r) => r.json());
        if (current.id == null) {
          status.textContent = "Nothing is currently showing.";
          return;
        }
        const res = await fetch(`/queue/${current.id}/unpin`, { method: "POST" });
        if (!res.ok) throw new Error(await res.text());
        status.textContent = "Unpinned — it'll rotate normally now.";
        loadQueue();
      } catch (err) {
        status.textContent = "Failed: " + err.message;
      } finally {
        button.disabled = false;
      }
    });
    // --- the queue ---------------------------------------------------
    const queueEl = document.getElementById("queue");
    const queueStatus = document.getElementById("queueStatus");

    async function loadQueue() {
      let items, showingId;
      try {
        [items, showingId] = await Promise.all([
          fetch("/queue").then((r) => r.json()),
          fetch("/current").then((r) => r.json()).then((c) => c.id),
        ]);
      } catch {
        queueStatus.textContent = "Couldn't reach the board.";
        return;
      }

      queueEl.replaceChildren();
      for (const m of items) {
        const li = document.createElement("li");
        if (m.id === showingId) li.className = "showing";

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = m.preview;
        if (m.id === showingId || m.pinned) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = m.pinned ? "PINNED" : "ON NOW";
          label.append(tag);
        }

        const del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "Delete";
        del.addEventListener("click", async () => {
          if (!confirm("Delete this message?\n\n" + m.preview)) return;
          del.disabled = true;
          queueStatus.textContent = "Deleting…";
          try {
            const res = await fetch("/queue/" + m.id, { method: "DELETE" });
            if (!res.ok) throw new Error(await res.text());
            queueStatus.textContent = "Deleted.";
            await loadQueue();
          } catch (err) {
            queueStatus.textContent = "Failed: " + err.message;
            del.disabled = false;
          }
        });

        li.append(label, del);
        queueEl.append(li);
      }
      if (!items.length) queueEl.textContent = "Nothing queued.";
    }

    // --- quiet hours -------------------------------------------------
    const quietState = document.getElementById("quietState");
    const quietButton = document.getElementById("quietButton");
    const quietStatus = document.getElementById("quietStatus");

    function renderQuiet(s) {
      if (!s.enabled) {
        quietState.textContent =
          "Quiet hours is switched off in the service settings.";
        quietButton.hidden = true;
        return;
      }
      if (s.snoozed) {
        const t = new Date(s.snoozed_until).toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
        });
        quietState.textContent =
          "Quiet hours paused — the board stays on until " + t + ".";
        quietButton.textContent = "Resume quiet hours now";
      } else {
        quietState.textContent =
          "Quiet hours: the board goes dark and silent " + s.window + ".";
        quietButton.textContent = "Keep the board on until morning";
      }
      quietButton.dataset.snooze = s.snoozed ? "false" : "true";
      quietButton.hidden = false;
    }

    async function loadQuiet() {
      try {
        renderQuiet(await fetch("/settings/quiet-hours").then((r) => r.json()));
      } catch {
        quietState.textContent = "Quiet hours: couldn't reach the board.";
      }
    }

    quietButton.addEventListener("click", async () => {
      quietButton.disabled = true;
      quietStatus.textContent = "Saving…";
      try {
        const res = await fetch("/settings/quiet-hours", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ snooze: quietButton.dataset.snooze === "true" }),
        });
        if (!res.ok) throw new Error(await res.text());
        renderQuiet(await res.json());
        quietStatus.textContent = "Saved.";
      } catch (err) {
        quietStatus.textContent = "Failed: " + err.message;
      } finally {
        quietButton.disabled = false;
      }
    });

    // --- display ------------------------------------------------------
    const bright = document.getElementById("brightness");
    const contrast = document.getElementById("contrast");
    const brightOut = document.getElementById("brightnessOut");
    const contrastOut = document.getElementById("contrastOut");
    const displayStatus = document.getElementById("displayStatus");

    const pct = (v) => Math.round(v * 100) + "%";

    async function loadDisplay() {
      try {
        const d = await fetch("/settings/display").then((r) => r.json());
        bright.value = Math.round(d.brightness * 100);
        contrast.value = Math.round(d.contrast * 100);
        brightOut.textContent = pct(d.brightness);
        contrastOut.textContent = pct(d.contrast);
        displayStatus.textContent = d.quiet_now
          ? "Quiet hours is on, so the board is dark regardless."
          : "";
      } catch {
        displayStatus.textContent = "Couldn't reach the board.";
      }
    }

    let saveTimer;
    function onSlide() {
      brightOut.textContent = bright.value + "%";
      contrastOut.textContent = contrast.value + "%";
      // Dragging a slider fires continuously; only POST once it settles,
      // or every frame would be a database write.
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        displayStatus.textContent = "Saving…";
        try {
          const res = await fetch("/settings/display", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              brightness: bright.value / 100,
              contrast: contrast.value / 100,
            }),
          });
          if (!res.ok) throw new Error(await res.text());
          displayStatus.textContent = "Saved — the board follows within 5s.";
        } catch (err) {
          displayStatus.textContent = "Failed: " + err.message;
        }
      }, 400);
    }
    bright.addEventListener("input", onSlide);
    contrast.addEventListener("input", onSlide);

    loadQuiet();
    loadQueue();
    loadDisplay();
  </script>
</body>
</html>
