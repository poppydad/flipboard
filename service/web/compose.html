<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Post to Board</title>
<!-- "Add to Home Screen" on iOS: opens without Safari's chrome, so posting a
     message is one tap from the home screen rather than a bookmark hunt. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Board" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111111" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" href="/icon.png" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 480px;
    margin: 2rem auto;
    /* viewport-fit=cover means the page runs under the notch/home indicator
       when launched from the home screen; keep content clear of both. */
    padding: env(safe-area-inset-top) calc(1rem + env(safe-area-inset-right))
             env(safe-area-inset-bottom) calc(1rem + env(safe-area-inset-left));
    background: #111;
    color: #eee;
  }
  h2 { font-weight: 600; }
  textarea {
    width: 100%;
    font-size: 1.1rem;
    padding: 0.75rem;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;
    resize: vertical;
  }
  label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #bbb;
  }
  button {
    width: 100%;
    padding: 0.9rem;
    font-size: 1.1rem;
    margin-top: 1rem;
    border-radius: 8px;
    border: none;
    background: #e8e4d8;
    color: #111;
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; }
  button.secondary {
    background: transparent;
    border: 1px solid #444;
    color: #eee;
  }
  #status, #unpinStatus { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
  .divider {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #333;
  }
  .divider p {
    margin: 0 0 0.5rem;
    font-size: 0.85rem;
    color: #888;
  }
</style>
</head>
<body>
  <h2>Post to Board</h2>
  <form id="composeForm">
    <textarea name="text" rows="3" maxlength="132" placeholder="What should the board say?" required></textarea>
    <label><input type="checkbox" name="pinned" /> Pin — show now, stay until unpinned</label>
    <button type="submit">Send</button>
  </form>
  <div id="status"></div>

  <div class="divider">
    <p>Pinned something and want it to rotate normally again?</p>
    <button id="unpinButton" type="button" class="secondary">Unpin current message</button>
    <div id="unpinStatus"></div>
  </div>

  <div class="divider">
    <p><a href="/compose/grid" style="color: #bbb;">Design a color grid →</a></p>
  </div>

  <script>
    document.getElementById("composeForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const button = form.querySelector("button");
      const status = document.getElementById("status");

      button.disabled = true;
      status.textContent = "Sending…";
      try {
        const res = await fetch("/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: form.text.value,
            pinned: form.pinned.checked,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        status.textContent = "Sent.";
        form.reset();
      } catch (err) {
        status.textContent = "Failed: " + err.message;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("unpinButton").addEventListener("click", async () => {
      const button = document.getElementById("unpinButton");
      const status = document.getElementById("unpinStatus");

      button.disabled = true;
      status.textContent = "Checking what's on the board…";
      try {
        const current = await fetch("/current").then((r) => r.json());
        if (current.id == null) {
          status.textContent = "Nothing is currently showing.";
          return;
        }
        const res = await fetch(`/queue/${current.id}/unpin`, { method: "POST" });
        if (!res.ok) throw new Error(await res.text());
        status.textContent = "Unpinned — it'll rotate normally now.";
      } catch (err) {
        status.textContent = "Failed: " + err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
