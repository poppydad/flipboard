# The Pi 5's vc4-hdmi ALSA device only accepts IEC958_SUBFRAME_LE, so without
# ACP (the ALSA card profile layer) WirePlumber finds no usable output and
# falls back to a Dummy Output sink — the board renders flap clicks that go
# nowhere. Forcing ACP on gives the normal 'Digital Stereo (HDMI)' profile,
# which wraps the device in the converting plugin.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-.*hdmi" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
]
